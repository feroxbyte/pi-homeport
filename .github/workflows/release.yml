name: Release

# Pushing a tag such as v0.2.0 stages that version on npm through trusted publishing (OIDC), with
# provenance and no npm token. The version goes live once a maintainer approves it with 2FA on
# npmjs.com (Staged Packages) or with `npm stage approve`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # No dependency cache in a release build.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match package.json's $version." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: npm stage publish
